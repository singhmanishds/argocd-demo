name: cicd

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main
  workflow_dispatch: {}

jobs:
  ci:
    outputs:
      commit_id: ${{ steps.vars.outputs.sha_short }}
    runs-on: self-hosted
    steps:
      - 
        name: Checkout code
        uses: actions/checkout@v4
        
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: sidmanish18/python-app:${{ steps.vars.outputs.sha_short }}
  
  cd:
    runs-on: self-hosted
    needs: ci
    steps:
      - 
        name: Checkout code
        uses: actions/checkout@v4
      -
        name: modify value file
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.commit_id }}
          pip install yq
          yq -Yi '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/python-app/values.yaml
      -
        name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.commit_id }} value file"
      - 
        name: Install Argo CD
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -ssL -o "$HOME/bin/argocd" https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x "$HOME/bin/argocd"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      -
        name: Argo CD app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd:80 \
          --plaintext \
          --grpc-web --username admin \
          --password ${{ secrets.ARGOCD_AUTH_TOKEN }}
          argocd app sync argocd-demo9090