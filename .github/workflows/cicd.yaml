name: cicd

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: self-hosted
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: sidmanish18/python-app:${{ steps.vars.outputs.sha_short }}
  
  cd:
    runs-on: self-hosted
    needs: ci
    steps:
      - 
        name: Install Argo CD
        shell: bash
        run: |
          curl -ssL -o /usr/local/bin/argocd http://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
      -
        name: Argo CD app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd:80 \
          --plaintext \
          --grpc-web --username ${{ vars.ARGOCD_SERVER }} \
          --password ${{ secrets.ARGOCD_AUTH_TOKEN }}
          argocd app sync python-app